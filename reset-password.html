<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose password | Track Right</title>
    <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell"><div class="auth-brand">Track Right</div><section class="auth-card">
        <h1>Choose a new password</h1><p>Use at least 10 characters.</p>
        <form id="reset-password-form" class="auth-form" hidden>
            <label>New password<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
            <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label>
            <button class="auth-primary" type="submit">Update password</button>
        </form>
        <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>
        <div class="auth-links"><a href="forgot-password.html">Request a new reset link</a><a href="login.html">Back to login</a></div>
    </section></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script><script src="js/password-reset.js"></script>
</body>
</html>
