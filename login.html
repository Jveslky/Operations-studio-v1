<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Track Right</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <div class="auth-brand">Track Right</div>
        <section class="auth-card">
            <h1>Welcome back</h1>
            <p>Log in to your Track Right workspace.</p>
            <form id="login-form" class="auth-form">
                <label>Email<input name="email" type="email" autocomplete="email" required></label>
                <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
                <button class="auth-primary" type="submit">Log in</button>
            </form>
            <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>
            <div class="auth-links">
                <a href="forgot-password.html">Forgot password?</a>
                <a href="signup.html">Create a shop account</a>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
