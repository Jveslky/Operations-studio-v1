<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Track Right</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <div class="auth-brand">Track Right</div>
        <section class="auth-card">
            <h1>Create your shop</h1>
            <p>The first account becomes the shop owner.</p>
            <form id="signup-form" class="auth-form">
                <label>Your name<input name="fullName" autocomplete="name" required></label>
                <label>Shop name<input name="shopName" autocomplete="organization" required></label>
                <label>Email<input name="email" type="email" autocomplete="email" required></label>
                <label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
                <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label>
                <button class="auth-primary" type="submit">Create account</button>
            </form>
            <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>
            <div class="auth-links"><a href="login.html">Back to login</a></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
