<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Track Right</title>
    <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell"><div class="auth-brand">Track Right</div><section class="auth-card">
        <h1>Reset your password</h1><p>We’ll email you a secure reset link.</p>
        <form id="forgot-password-form" class="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required></label>
            <button class="auth-primary" type="submit">Send reset link</button>
        </form>
        <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>
        <div class="auth-links"><a href="login.html">Back to login</a></div>
    </section></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script><script src="js/password-reset.js"></script>
</body>
</html>
