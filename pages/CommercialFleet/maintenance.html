<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maintenance | Commercial Fleet | Track Right</title>
  <link rel="stylesheet" href="commercial-fleet.css">
</head>
<body><a class="skip" href="#main">Skip to content</a>
  <header class="top"><div class="shell top-inner"><div><a class="brand" href="../../index.html">Track Right</a><span class="product">/ Commercial Fleet</span></div><span class="preview">LOCAL CONCEPT · NOT CONNECTED TO SHOP DATA</span></div></header><div class="shell layout"><nav class="nav" aria-label="Commercial Fleet pages"><a href="index.html">Dashboard</a><a href="units.html">Units</a><a href="maintenance.html" aria-current="page">Maintenance</a><a href="metrics.html">Metrics</a></nav><main id="main"><section class="intro"><p class="eyebrow">COMMERCIAL FLEET / MAINTENANCE</p><h1>Log the completed work and set the next PM.</h1></section><section class="panel" id="maintenance"><div class="section-head"><div><p class="eyebrow">WORK HISTORY</p><h2>Maintenance log</h2></div><span class="hint">Completed work follows the unit.</span></div>
        <form id="service-form" class="form-grid">
          <label>Unit<select id="service-unit" required></select></label>
          <label>Completed on<input id="service-date" type="date" required></label>
          <label>Work performed<input id="service-work" required maxlength="100" placeholder="Oil service"></label>
          <label>Vendor / technician<input id="service-vendor" maxlength="70" placeholder="Optional"></label>
          <label>Cost ($)<input id="service-cost" type="number" min="0" step=".01" value="0"></label>
          <label>Downtime (hours)<input id="service-down" type="number" min="0" step=".25" value="0"></label>
          <label>Meter at service<input id="service-meter" type="number" min="0" step="1" placeholder="Optional"></label>
          <label>Next PM reading<input id="service-next" type="number" min="0" step="1" placeholder="Optional"></label>
          <label>Next PM date<input id="service-next-date" type="date"></label>
          <button class="primary" type="submit">Log completed work</button>
        </form>
        <div class="rows" id="service-list"></div>
      </section></main></div><script src="commercial-fleet.js"></script></body></html>
