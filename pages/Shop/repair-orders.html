<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Repair Orders | Track Right</title>

    <link rel="stylesheet"
          href="./repair-orders.css">
</head>

<body>
    <header class="app-header">
        <div class="app-header-inner">
            <a class="app-brand"
               href="../../index.html">
                Track Right
            </a>

            <nav class="app-nav">
                <a href="../../index.html">
                    Dashboard
                </a>

                <a href="./repair-orders.html">
                    Repair Orders
                </a>
            </nav>
        </div>
    </header>

    <main class="page">
        <h1>Repair Orders</h1>

        <div class="repair-order-tools">
            <button id="new-repair-order-button"
                    class="new-ro-button"
                    type="button">
                New Repair Order
            </button>

            <button id="export-backup-button"
                    type="button">
                Export Backup
            </button>

            <label class="import-backup-button">
                Import Backup

                <input id="import-backup-input"
                       type="file"
                       accept=".json,application/json"
                       hidden>
            </label>
        </div>

        <form id="new-repair-order-form"
              class="new-repair-order-form"
              hidden>
            <h2>Create Repair Order</h2>

            <div class="new-ro-grid">
                <label>
                    Owner or Department

                    <input id="new-customer"
                           class="new-ro-input"
                           type="text"
                           required>
                </label>

                <label>
                    Unit
                    <select id="new-unit" required>
                        <option value="">Select a fleet unit</option>
                    </select>
                </label>

                <label>
                    Priority

                    <select id="new-priority"
                            class="new-ro-input">
                        <option value="Low">Low</option>

                        <option value="Medium"
                                selected>
                            Medium
                        </option>

                        <option value="High">High</option>
                    </select>
                </label>

                <label>
                    Assigned To

                    <select id="new-technician"
                            class="new-ro-input">
                        <option value="Unassigned">
                            Unassigned
                        </option>

                        <option value="Mike">Mike</option>
                        <option value="Sarah">Sarah</option>
                        <option value="Dave">Dave</option>
                    </select>
                </label>
            </div>

            <label>
                Complaint or Work Needed

                <textarea id="new-complaint"
                          class="new-ro-input"
                          required></textarea>
            </label>

            <div class="new-ro-actions">
                <button type="submit">
                    Create Repair Order
                </button>

                <button id="cancel-new-repair-order"
                        type="button">
                    Cancel
                </button>
            </div>
        </form>

        <div class="repair-order-board">
            <section class="repair-order-section">
                <h2>Needs Attention</h2>

                <div id="attention-orders"
                     class="repair-order-list"></div>
            </section>

            <section class="repair-order-section">
                <h2>In Progress</h2>

                <div id="in-progress-orders"
                     class="repair-order-list"></div>
            </section>

            <section class="repair-order-section">
                <h2>Complete</h2>

                <div id="complete-orders"
                     class="repair-order-list"></div>
            </section>
        </div>
    </main>

    <script src="./repair-orders.js"></script>
</body>
</html>
