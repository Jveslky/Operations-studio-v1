<!DOCTYPE html>
<html lang="en" data-login-path="../../login.html">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Repair Orders | Long Shift</title>

    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet"
          href="./repair-orders.css">
</head>

<body>

    <header class="app-header">
        <div class="app-header-inner">

            <a class="app-brand"
               href="../../index.html"><span class="brand-title">Long Shift</span><small class="brand-module">Shop Operations</small></a>

            <nav class="app-nav">

                <a href="shop-dashboard.html">
                    Dashboard
                </a>

                <a href="schedule.html">
                    Schedule
                </a>

                <a href="customers.html">
                    Customers
                </a>

                <a href="repair-orders.html"
                   class="active">
                    Repair Orders
                </a>

                <a href="invoices.html">
                    Invoices
                </a>

                <a href="accounts-payable.html">
                    Accounts Payable
                </a>

            </nav>

        </div>
    </header>

    <main class="page">
        <div class="repair-order-page-header">
            <div>
                <h1>Repair Orders</h1>

                <p>
                    Manage maintenance and repair work.
                </p>
            </div>
        </div>

        <div class="repair-order-tools">
            <div class="repair-order-tools-left">

                <button id="new-repair-order-button"
                        class="new-ro-button"
                        type="button">
                    New Repair Order
                </button>

            </div>
        </div>


            <form id="new-repair-order-form"
                  class="new-repair-order-form"
                  hidden>
                <h2>Create Repair Order</h2>

                <div class="intake-shortcuts" id="intake-shortcuts" hidden>
                    <button type="button" id="quick-customer-open">+ New customer</button>
                    <button type="button" id="quick-unit-open">+ New vehicle / unit</button>
                </div>
                <section id="quick-customer-panel" class="quick-intake" hidden aria-label="New customer">
                    <h3>New customer</h3>
                    <label>Name<input id="quick-customer-name" maxlength="200" autocomplete="name"></label>
                    <label>Phone (optional)<input id="quick-customer-phone" type="tel" autocomplete="tel"></label>
                    <label>Email (optional)<input id="quick-customer-email" type="email" autocomplete="email"></label>
                    <button type="button" id="quick-customer-save">Save and select customer</button>
                    <button type="button" data-intake-close="customer">Cancel</button>
                </section>
                <section id="quick-unit-panel" class="quick-intake" hidden aria-label="New vehicle or unit">
                    <h3>New vehicle / unit</h3>
                    <p id="quick-unit-customer"></p>
                    <label>Name / description<input id="quick-unit-name" maxlength="200" placeholder="e.g. 2018 Ford F-250 or Loader 3"></label>
                    <label>Year (optional)<input id="quick-unit-year" inputmode="numeric"></label>
                    <label>Make (optional)<input id="quick-unit-make"></label>
                    <label>Model (optional)<input id="quick-unit-model"></label>
                    <label>VIN / serial (optional)<input id="quick-unit-serial"></label>
                    <button type="button" id="quick-unit-save">Save and select vehicle</button>
                    <button type="button" data-intake-close="unit">Cancel</button>
                </section>
                <p id="quick-intake-message" role="status" aria-live="polite"></p>
                <div class="new-ro-grid">
                    <label>
                        Customer

                        <select id="new-customer"
                                class="new-ro-input"
                                required>
                            <option value="">
                                Select a customer
                            </option>
                        </select>
                    </label>

                    <label>
                        Vehicle

                        <select id="new-unit"
                                class="new-ro-input"
                                required>
                            <option value="">
                                Select a customer vehicle
                            </option>
                        </select>
                    </label>

                    <label>
                        Priority

                        <select id="new-priority"
                                class="new-ro-input">
                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium"
                                    selected>
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>
                        </select>
                    </label>

                    

                        <label>
                            Technician

                            <select id="new-technician"
                                    class="detail-input">
                                <option value="Unassigned">Unassigned</option>
                            </select>
                    </label>
                </div>

                <p id="new-ro-data-message"
                   class="new-ro-data-message"
                   role="status"
                   aria-live="polite"></p>

                <label>
                    Complaint or Work Needed

                    <textarea id="new-complaint"
                              class="new-ro-input"
                              required></textarea>
                </label>

                <div class="new-ro-actions">
                    <button type="submit">
                        Create Repair Order
                    </button>

                    <button id="cancel-new-repair-order"
                            type="button">
                        Cancel
                    </button>
                </div>
            </form>
            <div class="repair-order-board">

                <section class="repair-order-section">
                    <h2>Needs Attention</h2>

                    <div id="attention-orders"
                         class="repair-order-list"></div>
                </section>

                <section class="repair-order-section">
                    <h2>In Progress</h2>

                    <div id="in-progress-orders"
                         class="repair-order-list"></div>
                </section>

                <section class="repair-order-section">
                    <h2>Complete</h2>

                    <div id="complete-orders"
                         class="repair-order-list"></div>
                </section>

            </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/shop-appearance.js"></script>
    <script src="../../js/shop-behavior.js"></script>
    <script src="./shop-repair-orders-data.js"></script>
    <script src="./repair-orders.js"></script>
    <script src="./repair-order-intake.js"></script>
</body>
</html>
