<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Repair Order Details</title>

    <link rel="stylesheet" href="../../css/repair-order-detail.css">
   
</head>

<body>
    <header class="app-header">
        <div class="app-header-inner">
            <a class="app-brand" href="../../index.html">
                Track Right
            </a>

            <nav class="app-nav">
                <a href="../../index.html">Dashboard</a>
                <a href="./repair-orders.html">Repair Orders</a>
            </nav>
        </div>
    </header>

    <main class="repair-detail-page">

        <body>

            <main class="repair-detail-page">

                <section class="detail-header">
                    <div>
                        <h1 id="ro-number">Repair Order</h1>

                        <p>
                            <span id="customer-name"></span>
                            •
                            <span id="unit-name"></span>
                        </p>
                    </div>

                    <div class="detail-actions">
                        <span id="save-message"></span>

                        <button id="close-button" type="button" class="secondary-btn">
                            Close
                        </button>

                        <button id="save-button" type="button" class="primary-btn">
                            Save
                        </button>
                        <button id="archive-button"
                                class="secondary-btn"
                                type="button">
                            Archive
                        </button>
                    </div>

                </section>

                <section class="detail-grid">

                    <div class="detail-card">
                        <h3>Status</h3>
                        <span id="status-display" class="status status-open"></span>
                    </div>
                    <div class="detail-card">
                        <h3>Priority</h3>

                        <select id="priority-select">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>

                    <div class="detail-card">
                        <h3>Technician</h3>

                        <select id="technician-select">
                            <option value="Unassigned">Unassigned</option>
                            <option value="Mike">Mike</option>
                            <option value="Sarah">Sarah</option>
                        </select>
                    </div>
                    <div class="additional-tech-row">
                        <select id="additional-technician-select"
                                class="detail-input">
                            <option value="">Additional Technician</option>
                            <option value="Mike">Mike</option>
                            <option value="Sarah">Sarah</option>
                            <option value="Dave">Dave</option>
                        </select>

                        <input id="additional-work-performed"
                               class="detail-input"
                               type="text"
                               placeholder="Work performed">
                    </div>

                </section>

                <section class="detail-card">
                    <label for="complaint">Complaint</label>
                    <textarea id="complaint"
                              class="detail-input"
                              rows="4"></textarea>
                </section>

                <section class="detail-card">
                    <label for="parts-needed">Parts Needed</label>
                    <textarea id="parts-needed"
                              class="detail-input"
                              rows="4"></textarea>
                </section>

                <section class="detail-card">
                    <label for="customer-notes">Customer Notes</label>
                    <textarea id="customer-notes"
                              class="detail-input"
                              rows="4"></textarea>
                </section>

                <section class="detail-card">
                    <label for="technician-notes">Technician Notes</label>
                    <textarea id="technician-notes"
                              class="detail-input"
                              rows="4"></textarea>
                </section>

                <section class="detail-card">
                    <label for="labor-hours">Labor Hours</label>

                    <input id="labor-hours"
                           type="number"
                           step="0.1"
                           class="detail-input">
                </section>

                <section class="detail-card">
                    <label for="status-select">Status</label>

                    <select id="status-select" class="detail-input">
                        <option value="Open">Open</option>
                        <option value="Scheduled">Scheduled</option>
                        <option value="Needs Info">Needs Info</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Waiting Parts">Waiting Parts</option>
                        <option value="Complete">Complete</option>
                    </select>
                </section>

                <section class="detail-card">
                    <h2>Timeline</h2>

                    <div class="timeline-item">
                        Repair order opened
                    </div>
                </section>

            </main>
            <script src="./repair-order-details.js" defer></script>
        </body>

      
</html>
